name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Unit tests and dev debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check code formatting
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" ktlintCheck

      - name: Unit tests
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" testDevDebugUnitTest

      - name: Build dormant production and sync test APKs
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDevDebug assembleProdDebug

      - name: Upload Android sync artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-sync-artifacts
          path: |
            app/build/outputs/apk/dev/debug/app-dev-debug.apk
            app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error

  extension-check:
    name: Extension typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('extension/bun.lock', 'extension/package.json') }}

      - name: Install dependencies
        working-directory: extension
        run: bun install

      - name: Typecheck
        working-directory: extension
        run: bunx tsc --noEmit

      - name: Tests
        working-directory: extension
        run: bun test

      - name: Sync host performance gates
        working-directory: extension
        run: bun run sync:gates

      - name: Build
        working-directory: extension
        run: bun run build

      - name: Verify dormant production package
        working-directory: extension
        run: bun run sync:verify-package --production

      - name: Build and verify dedicated sync test package
        working-directory: extension
        env:
          POMO_SYNC_TEST_ARTIFACT: "true"
        run: |
          bun run build
          bun run sync:verify-package --test
          cd dist
          zip -qr ../pomo-sync-test-extension.zip .

      - name: Upload sync host evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sync-host-evidence
          path: extension/evidence/sync-host-benchmark.json
          if-no-files-found: error

      - name: Upload Chrome sync artifacts and package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrome-sync-artifacts
          path: |
            extension/pomo-sync-test-extension.zip
            extension/evidence/sync-package-production.json
            extension/evidence/sync-package-test.json
          if-no-files-found: error
