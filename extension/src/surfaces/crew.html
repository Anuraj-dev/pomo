<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Pomo · Crew</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="crew.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <span class="title">Crew</span>
        <span class="fresh num" id="freshness">—</span>
      </header>

      <section class="crews">
        <div class="chips" id="chips"></div>
        <div class="crew-actions">
          <button id="createBtn">New crew</button>
          <button id="joinBtn">Join</button>
          <button id="shareBtn">Share / QR</button>
          <button id="refreshBtn">Refresh</button>
        </div>
      </section>

      <section class="window-tabs" id="windowTabs">
        <button class="tab" data-window="today">Today</button>
        <button class="tab" data-window="7d">7d</button>
        <button class="tab" data-window="30d">30d</button>
        <button class="tab" data-window="all">All</button>
      </section>

      <section class="summary" id="summary"></section>

      <section class="standing" id="standing"></section>

      <section class="board" id="board" data-empty="true"></section>

      <section class="panel" id="manage" hidden>
        <div class="panel-actions">
          <button id="manageClose">Close</button>
        </div>
        <div class="panel-body" id="manageBody"></div>
      </section>
    </main>
    <script type="module" src="crew.js"></script>
  </body>
</html>
